[project]
name = "lab01-agentic-coding"
version = "0.1.0"
description = "DSAN 6725 Lab 01: Agentic coding with AI assistants on a polars data pipeline"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Missing student modules error at import; still run the tests that can run.
addopts = "--continue-on-collection-errors"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
